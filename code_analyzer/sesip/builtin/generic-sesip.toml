[[toe_module]]
id = "all"
paths = ["**"]

[[level]]
id = "error"
label = "Error"
rank = 4
description = "Requires immediate review because the issue may cause serious runtime failures; missing build context can still make individual cases false positives."
source = {doc = "tp", page = "26-27", quote = ""}

[[level]]
id = "warning"
label = "Warning"
rank = 3
description = "Potentially compromises code during execution and should be reviewed with attention to its actual use."
source = {doc = "tp", page = "26-27", quote = ""}

[[level]]
id = "style"
label = "Style"
rank = 2
description = "Coding-practice or optimization concern without a direct security impact, but capable of contributing to unwanted behavior."
source = {doc = "tp", page = "26-27", quote = ""}

[[level]]
id = "information"
label = "Information"
rank = 1
description = "Often caused by incomplete external dependencies or analysis context; it still requires verification before being dismissed."
source = {doc = "tp", page = "26-27", quote = ""}

[[grading_rule]]
match = {native = "error"}
level = "error"
basis = "native-exact"

[[grading_rule]]
match = {native = "warning"}
level = "warning"
basis = "native-exact"

[[grading_rule]]
match = {native = "style"}
level = "style"
basis = "native-exact"

[[grading_rule]]
match = {native = "information"}
level = "information"
basis = "native-exact"

[[grading_rule]]
match = {tool = "flawfinder", native = "note"}
level = "information"
basis = "proposed"

[[grading_rule]]
match = {tool = "cppcheck", native = ["portability", "performance"]}
level = "style"
basis = "proposed"

[[grading_rule]]
match = {tool = "splint", family = ["buffer", "null-dereference", "resource-leak", "format", "uninitialized"]}
level = "warning"
basis = "proposed"

[[grading_rule]]
match = {tool = "splint"}
level = "information"
basis = "proposed"
