# Built-in, read-only.  Copy it to start a profile of your own; an evaluation
# confirms a profile before its rules and TOE are used for the list.
[evaluation]
id = "generic-sesip"
name = "Generic SESIP (no Security Target)"
status = "builtin"
version = 1
base = "builtin"

[test_plan]
reference = "levels as in the DEKRA SESIP L3 AVA test plan (RT700 v1.1, §7.4.1); no issue categories"
levels_section = "7.4.1"
categories_section = ""
category_kind = "defect_type"

[advanced]
pv_min_level = "warning"

