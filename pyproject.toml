[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-analyzer"
version = "2.0.0"
description = "Evidence-first C/C++ static analysis runner for WSL"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["textual>=8.2.8,<9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
code-analyzer = "code_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["code_analyzer*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "live_tools: requires installed native analyzers",
  "tfm_full: slow, manual full-repository acceptance test",
]
