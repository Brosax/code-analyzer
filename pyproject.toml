[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-analyzer"
version = "2.0.0"
description = "Evidence-first C/C++ static analysis runner for WSL"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["textual>=8.2.8,<9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
code-analyzer = "code_analyzer.cli:main"

[tool.setuptools]
py-modules = ["run_code_analyzer"]

[tool.setuptools.packages.find]
include = ["code_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_tools: requires installed native analyzers",
  "tfm_full: slow, manual full-repository acceptance test",
]
