[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-analyzer"
version = "3.0.0"
description = "SESIP code evaluation: static analyzers, a numbered vulnerability list, targeted AI review on a local GPU"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# None: the standard library only.  pdftotext (poppler) and bwrap are optional external programs.
dependencies = []

[project.optional-dependencies]
# setuptools: tests/test_packaging.py builds a wheel to prove the data files ship.
dev = ["pytest>=8", "ruff>=0.5", "setuptools>=77"]

[project.scripts]
code-analyzer = "code_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["code_analyzer*"]

# Data files that are not Python modules: without these a non-editable install lacks them.
[tool.setuptools.package-data]
"code_analyzer.sesip" = ["builtin/*.toml"]
"code_analyzer.web" = ["static/*"]
"code_analyzer.aireview" = ["lenses/*.md"]
"code_analyzer.kernel" = ["method.md"]

[tool.ruff]
target-version = "py311"
# Agent worktrees live here and hold other branches' in-flight code; linting
# them would report someone else's work as this checkout's problem.
extend-exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "live_tools: requires installed native analyzers",
  "tfm_full: slow, manual full-repository acceptance test",
]
